name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # later steps (npm, tests) never see the workflow token
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci # install scripts are off via .npmrc (ignore-scripts=true); nothing here needs them
      - name: Lockfile points only at the npm registry, with integrity hashes
        run: node scripts/check-lockfile.mjs
      - run: npm run typecheck
      # build before test: security.test.ts checks the headers on the built app page (a 404 has none)
      - run: npm run build
      - run: npm test

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # later steps (npm, tests) never see the workflow token
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps only (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser suites (ui, focus, motion, selfhost)
        # mktemp -d (used by e2e/run.sh for per-suite data dirs and server logs) honours TMPDIR,
        # so logs land in a known place for the failure upload below. It must stay outside the
        # workspace: the selfhost suite copies the repo into TMPDIR.
        env:
          TMPDIR: ${{ runner.temp }}/e2e-tmp
        run: mkdir -p "$TMPDIR" && e2e/run.sh
      - name: Upload logs and Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-artifacts
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/e2e-tmp/**/*.log
            test-results/
            playwright-report/

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # later steps (npm, tests) never see the workflow token
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (non-blocking, production deps)
        run: |
          {
            echo '## npm audit --omit=dev'
            echo '```'
            npm audit --omit=dev || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
