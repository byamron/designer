name: Workflow security

# Static analysis of the workflow files themselves. Anything that merges can change what runs in CI and, through
# Update & Restart, on the owner's Mac, so these files get their own gate.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1' # new zizmor audits and newly published action advisories

permissions: {}

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install zizmor (pinned, hash-checked)
        run: python -m pip install --require-hashes -r .github/zizmor/requirements.txt
      - name: zizmor .github (any finding fails)
        env:
          GH_TOKEN: ${{ github.token }} # read-only: lets zizmor check pinned SHAs and action advisories online
        run: zizmor --format plain .github

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned release, checksum-verified)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # actionlint_1.7.12_linux_amd64.tar.gz, from the release's checksums file
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (syntax, expressions, shellcheck on run steps)
        run: '"$RUNNER_TEMP/actionlint" -color'
