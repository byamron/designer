# Keeps the lockfile and the pinned GitHub Actions current. Security updates for known-vulnerable dependencies are a
# repository setting (already on); this adds the routine version bumps as small grouped pull requests, so a fix is never
# one big jump. Nothing merges by itself: review each PR like any other (docs/pr-protocol.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
